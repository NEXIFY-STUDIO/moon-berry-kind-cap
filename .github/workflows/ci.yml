# GitHub Actions runners are currently blocked on this account
# ("account is locked due to a billing issue").
# Until billing is fixed, CI is verified locally via: npm run ci:verify
# which posts a green commit status (ci/local-quality).
#
# Re-enable push/PR triggers after billing is unlocked.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
        env:
          CI: "true"
